name = "linknote-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

# 生产自定义域名（xykong.xyz 已托管在 Cloudflare）
routes = [
  { pattern = "relay.xykong.xyz", custom_domain = true }
]

# PWA 静态文件由 Worker 一起托管：一个域名、同源、免 CORS。
# app/www 会由 `npm --prefix app run sync` 复制到 relay/public。
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "linknote-db"
database_id = "e1ec0b6c-acd7-4248-9cd5-d9e18e5f9ba8"
migrations_dir = "migrations"

[vars]
PUBLIC_BASE_URL = "https://relay.xykong.xyz"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:8787,http://localhost:8787,https://relay.xykong.xyz,capacitor://localhost,https://localhost"
PAIRING_TTL_SECONDS = "600"
TASK_LEASE_SECONDS = "1800"

[observability]
enabled = true
head_sampling_rate = 1
