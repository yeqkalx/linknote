<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f4f7fc" />
    <title>链记 · 正在打开</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f7fc;
        color: #0f1b30;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      main {
        text-align: center;
        padding: 24px;
      }
      .mark {
        width: 48px;
        height: 48px;
        margin: 0 auto 12px;
        color: #1e4dfd;
      }
      p {
        margin: 6px 0;
        font-size: 15px;
        line-height: 1.6;
      }
      .sub {
        color: #64748b;
        font-size: 13px;
      }
      a {
        color: #1a3fc4;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0b1220;
          color: #eaf0ff;
        }
        .sub {
          color: #7f90ad;
        }
        a {
          color: #8aa6ff;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="./icons/icon-192.png" alt="" />
      <p>正在打开链记…</p>
      <p class="sub">如果没有自动跳转，请<a href="./index.html#/home">点此进入收件箱</a>。</p>
    </main>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search || "");
          var parts = [params.get("title"), params.get("text"), params.get("url")];
          var text = parts
            .filter(function (part) {
              return part && String(part).trim();
            })
            .join("\n")
            .trim();

          var target = "./index.html#/home";
          if (text) {
            // 只允许通过 hash 传参，内容不会出现在服务端日志里。
            target += "?draft=" + encodeURIComponent(text);
          }
          window.location.replace(target);
        } catch (error) {
          window.location.replace("./index.html#/home");
        }
      })();
    </script>
  </body>
</html>
