[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linknote-agent"
version = "0.1.0"
description = "LinkNote Windows PC Agent：WebSocket 实时接收 Relay 任务并调用本机 BiliNote 生成 Markdown 笔记"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LinkNote" }]
dependencies = [
    "httpx>=0.27,<1",
    "websockets>=13,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
linknote-agent = "linknote_agent.cli:main"

[tool.setuptools.packages.find]
include = ["linknote_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
