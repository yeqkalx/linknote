[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linknote-desktop"
version = "0.2.0"
description = "LinkNote Windows desktop client: tray agent + BiliNote engine setup UI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LinkNote" }]
dependencies = [
    "PySide6>=6.7,<7",
    "httpx>=0.27,<1",
    "qrcode[pil]>=8.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.10",
]

[project.scripts]
linknote-desktop = "linknote_desktop.__main__:main"

[tool.setuptools.packages.find]
include = ["linknote_desktop*"]

[tool.setuptools.package-data]
linknote_desktop = ["resources/*"]
